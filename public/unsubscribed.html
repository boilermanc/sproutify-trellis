<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>You're unsubscribed</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f1f5f9; margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .card {
      background: #fff; max-width: 460px; width: 100%; padding: 44px 40px;
      border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,.08); text-align: center;
    }
    .mark {
      width: 52px; height: 52px; margin: 0 auto 20px; border-radius: 14px;
      background: #ecfdf5; display: flex; align-items: center; justify-content: center;
    }
    .mark svg { width: 26px; height: 26px; stroke: #059669; }
    h1 { color: #059669; font-weight: 800; font-size: 22px; margin: 0 0 14px; letter-spacing: -.3px; }
    p { color: #475569; font-size: 15px; line-height: 1.65; margin: 0; }
    .sub { margin-top: 14px; font-size: 13px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark" id="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <h1 id="title">You're unsubscribed</h1>
    <p id="message"></p>
    <p class="sub" id="sub">Changed your mind? Just reply to any past email and we'll help you re-subscribe.</p>
  </div>

  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      var status = p.get('status');
      var brand = p.get('brand'); // brand DISPLAY name only — never an email address
      var titleEl = document.getElementById('title');
      var msgEl = document.getElementById('message');
      var subEl = document.getElementById('sub');
      var markEl = document.getElementById('mark');

      if (status === 'invalid') {
        titleEl.textContent = 'Invalid link';
        msgEl.textContent = 'This unsubscribe link is missing a valid email address. Please contact support if you keep receiving mail.';
        subEl.style.display = 'none';
        markEl.style.display = 'none';
      } else if (status === 'error') {
        titleEl.textContent = 'Something went wrong';
        msgEl.textContent = "We couldn't process your request right now. Please try again in a moment, or reply to any past email.";
        subEl.style.display = 'none';
        markEl.style.display = 'none';
      } else if (brand) {
        // Per-branch unsubscribe. textContent keeps the brand value inert (no HTML injection).
        msgEl.textContent = "You've been removed from " + brand + " marketing emails. You'll still receive emails from other Sproutify brands you signed up for.";
      } else {
        // Global unsubscribe.
        msgEl.textContent = "You've been removed from Sproutify marketing emails. You won't receive further campaigns from any of our brands.";
      }
    })();
  </script>
</body>
</html>
