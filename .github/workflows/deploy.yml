name: Inspect Trellis audio worker

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - '.github/workflows/deploy.yml'
      - 'scripts/inspect-stitch-worker.py'
      - 'scripts/smoke-stitch-worker.py'

permissions:
  contents: read

concurrency:
  group: trellis-production-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check inspector syntax and worker regressions
        run: |
          python -m py_compile scripts/inspect-stitch-worker.py scripts/smoke-stitch-worker.py workers/stitch_worker.py
          python -m unittest discover -s tests -p test_stitch_memory.py -v

  inspect:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ops/trellis-stitch-release'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Install SSH transport
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Read-only inspection using existing deployment credentials
        env:
          IONOS_HOST: ${{ secrets.IONOS_HOST }}
          IONOS_PORT: ${{ secrets.IONOS_PORT }}
          IONOS_USERNAME: ${{ secrets.IONOS_USERNAME }}
          SSHPASS: ${{ secrets.IONOS_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$IONOS_HOST" && test -n "$IONOS_PORT" && test -n "$IONOS_USERNAME" && test -n "$SSHPASS"
          readonly_ssh() {
            local source="$1" interpreter="$2" error_file status attempt
            error_file="$(mktemp)"
            for attempt in 1 2; do
              if sshpass -e ssh -T \
                -o StrictHostKeyChecking=accept-new \
                -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
                -p "$IONOS_PORT" "$IONOS_USERNAME@$IONOS_HOST" \
                "$interpreter -" < "$source" 2>"$error_file"; then
                rm -f "$error_file"
                return 0
              else
                status=$?
                cat "$error_file" >&2
                # Retry only a transient transport reset, never auth/host-key or code failures.
                if [ "$status" != 255 ] || ! grep -Eq 'Connection reset|Connection timed out|Connection closed' "$error_file"; then
                  rm -f "$error_file"
                  return "$status"
                fi
                if [ "$attempt" = 1 ]; then sleep 5; fi
              fi
            done
            rm -f "$error_file"
            return "$status"
          }
          readonly_ssh scripts/inspect-stitch-worker.py python3
          readonly_ssh scripts/smoke-stitch-worker.py /opt/trellis/workers/.venv/bin/python

