name: Inspect Trellis audio worker

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - '.github/workflows/deploy.yml'
      - 'scripts/inspect-stitch-worker.py'
      - 'scripts/smoke-stitch-worker.py'

permissions:
  contents: read

concurrency:
  group: trellis-production-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check inspector syntax and worker regressions
        run: |
          python -m py_compile scripts/inspect-stitch-worker.py scripts/smoke-stitch-worker.py workers/stitch_worker.py
          python -m unittest discover -s tests -p test_stitch_memory.py -v

  inspect:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ops/trellis-stitch-release'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Install SSH transport
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Read-only inspection using existing deployment credentials
        env:
          IONOS_HOST: ${{ secrets.IONOS_HOST }}
          IONOS_PORT: ${{ secrets.IONOS_PORT }}
          IONOS_USERNAME: ${{ secrets.IONOS_USERNAME }}
          SSHPASS: ${{ secrets.IONOS_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$IONOS_HOST" && test -n "$IONOS_PORT" && test -n "$IONOS_USERNAME" && test -n "$SSHPASS"
          sshpass -e ssh -T \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            -p "$IONOS_PORT" "$IONOS_USERNAME@$IONOS_HOST" \
            'python3 -' < scripts/inspect-stitch-worker.py
          sshpass -e ssh -T \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            -p "$IONOS_PORT" "$IONOS_USERNAME@$IONOS_HOST" \
            '/opt/trellis/workers/.venv/bin/python -' < scripts/smoke-stitch-worker.py

